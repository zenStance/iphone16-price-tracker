name: 每日更新二手 iPhone 16 行情

on:
  schedule:
    # UTC 19:00 = 台北時間隔天凌晨 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 抓取各站資料
        run: python scrape.py

      - name: 產生網頁
        run: python build.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json docs/index.html
          git diff --staged --quiet || git commit -m "每日更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
